<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0f172a" />
    
    <!-- PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <meta name="description" content="CodeX - Premium Web Code Editor" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    
    <title>CodeX Editor</title>
    
    <style>
      /* Splash Screen Styles */
      body { 
        background-color: #0f172a; 
        margin: 0; 
        overflow: hidden; 
      }
      
      #splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: radial-gradient(circle at center, #1e293b, #0f172a);
        z-index: 9999;
        transition: opacity 0.5s ease;
      }

      .splash-logo {
        width: 100px;
        height: 100px;
        animation: pulse-glow 2s infinite alternate;
        margin-bottom: 24px;
      }

      .splash-title {
        font-family: 'Outfit', sans-serif;
        font-size: 2rem;
        font-weight: 700;
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 1px;
        margin-bottom: 8px;
        animation: fade-in-up 1s ease-out forwards;
      }

      .splash-subtitle {
        font-family: 'Outfit', sans-serif;
        color: #64748b;
        font-size: 0.9rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        animation: fade-in-up 1s ease-out 0.2s forwards;
        opacity: 0;
      }

      .loader {
        margin-top: 40px;
        width: 40px;
        height: 40px;
        border: 4px solid rgba(56, 189, 248, 0.2);
        border-top-color: #38bdf8;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes pulse-glow {
        0% { transform: scale(0.95); filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.3)); }
        100% { transform: scale(1.05); filter: drop-shadow(0 0 30px rgba(56, 189, 248, 0.8)); }
      }

      @keyframes fade-in-up {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen HTML -->
    <div id="splash-screen">
      <img src="/logo.svg" alt="CodeX Logo" class="splash-logo" />
      <h1 class="splash-title">CodeX</h1>
      <p class="splash-subtitle">Premium Code Editor</p>
      <div class="loader"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
